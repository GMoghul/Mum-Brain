# Builds the iPhone app on GitHub's Mac computers, so no Mac is needed at home.
#
# Job 1 "build-check": a quick test build (no signing) on every push.
# Job 2 "testflight":   signs the app and uploads it to App Store Connect / TestFlight.
#                       Runs only once the three App Store Connect secrets are saved in
#                       GitHub (Settings > Secrets and variables > Actions):
#                         ASC_KEY_ID     - the Key ID of the App Store Connect API key
#                         ASC_ISSUER_ID  - the Issuer ID shown above the keys
#                         ASC_KEY_P8     - the full text of the AuthKey_XXXX.p8 file
#                       The key needs Admin access (Apple requires it for cloud signing).
name: iPhone app build

on:
  push:
    branches: [app-store]
  workflow_dispatch:
    inputs:
      mode:
        description: "upload = send to TestFlight, check = build and sign only (nothing uploaded)"
        type: choice
        options: [upload, check]
        default: upload

env:
  TEAM_ID: 327WHDC3C5

jobs:
  build-check:
    # Only on a manual run - the TestFlight job below does a full build anyway,
    # and GitHub's Macs are often busy, so one Mac per push is quicker.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Install app tools
        run: npm install

      - name: Copy the web app in
        run: npm run web

      - name: Create the iPhone project
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Add the home screen widget
        run: scripts/add-widget.sh

      - name: Test build (no signing)
        run: |
          set -o pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the Apple secrets are saved
        id: secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "App Store Connect secrets not saved yet - skipping the TestFlight upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Use the newest Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: |
          XC=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Build the iPhone project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm install
          npm run web
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Add the home screen widget
        if: steps.secrets.outputs.ready == 'true'
        run: scripts/add-widget.sh

      - name: App settings (icon, version, export compliance)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          PLIST=ios/App/App/Info.plist
          # Uses only Apple's built-in encryption (family sharing), so no export paperwork per build.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # App icon: the Mum Brain icon instead of Capacitor's placeholder.
          ICON=$(ls ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png | head -1)
          cp icon-1024.png "$ICON"
          echo "Build number: ${{ github.run_number }}"

      - name: Save the App Store Connect key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive (signed in the next step)
        # Archived unsigned: automatic signing at this stage wants a registered test device.
        # The upload step signs it for the App Store using Apple's cloud signing.
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || {
              # Show the errors as annotations so they can be read without the full log.
              grep -E "error:|\*\* ARCHIVE FAILED" "$RUNNER_TEMP/archive.log" | sort -u | head -n 9 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 60 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/archive.log"

      - name: Mark the App Group in the archive
        # The archive is unsigned, so give the app and widget a placeholder signature that carries
        # their App Group. The upload step re-signs both for real and keeps the App Group.
        if: steps.secrets.outputs.ready == 'true'
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          for f in "$APP"/Frameworks/*; do [ -e "$f" ] && codesign -f -s - "$f"; done
          for x in "$APP"/PlugIns/*.appex; do
            [ -e "$x" ] || continue
            N=$(basename "$x" .appex)
            codesign -f -s - --entitlements "ios/App/$N/$N.entitlements" "$x"
          done
          codesign -f -s - --entitlements ios/App/App/App.entitlements "$APP"
          ls "$APP/PlugIns"
          codesign -d --entitlements - "$APP" 2>/dev/null | tail -n 8

      - name: Upload to App Store Connect (TestFlight)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$OPTS"
          plutil -insert method -string app-store-connect "$OPTS"
          if [ "${{ inputs.mode }}" = "check" ]; then DEST=export; else DEST=upload; fi
          plutil -insert destination -string $DEST "$OPTS"
          plutil -insert teamID -string "$TEAM_ID" "$OPTS"
          plutil -insert signingStyle -string automatic "$OPTS"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$OPTS"
          cat "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || {
              grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -n 9 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 60 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/export.log"

      - name: Show what got signed (check mode)
        if: steps.secrets.outputs.ready == 'true' && inputs.mode == 'check'
        run: |
          cd "$RUNNER_TEMP/export" && ls && unzip -q -o *.ipa -d ipa
          A=ipa/Payload/App.app
          for B in "$A" "$A/PlugIns/MumBrainWidget.appex" "$A/PlugIns/MumBrainNotify.appex"; do
            E=$(codesign -d --entitlements - --xml "$B" 2>/dev/null | plutil -convert json -o - - 2>/dev/null || true)
            echo "::notice::$(basename "$B"): $E"
            echo "$E" | grep -q "group.com.gmoghul.mumbrainsorted" || { echo "::error::$(basename "$B") is missing the App Group"; exit 1; }
          done
          codesign -d --entitlements - --xml "$A" 2>/dev/null | grep -q "aps-environment" || { echo "::error::App.app is missing Push Notifications (aps-environment)"; exit 1; }

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
